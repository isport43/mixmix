terms_section:
  kicker: "Перед бронюванням"
  title: "Важливі умови"
  items:
    - question: "Як забронювати дату?"
      answer: "Напишіть нам в Instagram або зателефонуйте. Бронювання підтверджується після внесення завдатку."
    - question: "Чи входить дорога у вартість?"
      answer: "Ні, виїзд у дві сторони розраховується окремо залежно від локації."
    - question: "Чи є доплата за термінове бронювання?"
      answer: "Для бронювання менш ніж за добу може діяти доплата 300 грн. Ранні виїзди до 09:00 та пізні після 21:00 — плюс 500 грн."
    - question: "Які умови оренди надувного костюма?"
      answer: "Оренда — 500 грн, завдаток — 500 грн. Самовивіз або доставка містом. Бронювання костюма бажано робити щонайменше за добу."
    - question: "Що важливо під час дитячого свята?"
      answer: "Просимо дорослих самостійно стежити за безпекою дітей. Якщо гості пошкодили костюм або реквізит, ремонт оплачує замовник."

